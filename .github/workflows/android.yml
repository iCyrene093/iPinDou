name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configure Android SDK
      shell: bash
      env:
        ANDROID_CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
        ANDROID_CMDLINE_TOOLS_SHA256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
      run: |
        set -euo pipefail

        android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
        sdkmanager_bin="$android_home/cmdline-tools/latest/bin/sdkmanager"

        if [ ! -x "$sdkmanager_bin" ]; then
          mkdir -p "$android_home/cmdline-tools"
          curl --fail --location --show-error --silent "$ANDROID_CMDLINE_TOOLS_URL" --output "$RUNNER_TEMP/android-commandline-tools.zip"
          echo "$ANDROID_CMDLINE_TOOLS_SHA256  $RUNNER_TEMP/android-commandline-tools.zip" | sha256sum --check --status
          rm -rf "$android_home/cmdline-tools/latest"
          unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$RUNNER_TEMP/android-commandline-tools"
          mv "$RUNNER_TEMP/android-commandline-tools/cmdline-tools" "$android_home/cmdline-tools/latest"
        fi

        echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
        echo "$android_home/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$android_home/platform-tools" >> "$GITHUB_PATH"

        yes | "$sdkmanager_bin" --licenses >/dev/null
        "$sdkmanager_bin" 'platforms;android-35' 'build-tools;35.0.0'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.14.4'

    - name: Run core JVM tests
      run: gradle :app:testCoreJava --warning-mode all

    - name: Generate CI release signing key
      run: |
        keytool -genkeypair \
          -keystore "$RUNNER_TEMP/ipindou-ci-release.jks" \
          -storepass "$IPINDOU_RELEASE_STORE_PASSWORD" \
          -keypass "$IPINDOU_RELEASE_KEY_PASSWORD" \
          -alias "$IPINDOU_RELEASE_KEY_ALIAS" \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=iPinDou CI,O=iPinDou,C=US"
      env:
        IPINDOU_RELEASE_STORE_PASSWORD: android
        IPINDOU_RELEASE_KEY_PASSWORD: android
        IPINDOU_RELEASE_KEY_ALIAS: ipindou-ci-release

    - name: Build signed release APK with Android toolchain
      run: >-
        gradle :app:assembleRelease --warning-mode all
        -Pipindou.releaseStoreFile="$RUNNER_TEMP/ipindou-ci-release.jks"
        -Pipindou.releaseStorePassword="$IPINDOU_RELEASE_STORE_PASSWORD"
        -Pipindou.releaseKeyAlias="$IPINDOU_RELEASE_KEY_ALIAS"
        -Pipindou.releaseKeyPassword="$IPINDOU_RELEASE_KEY_PASSWORD"
      env:
        IPINDOU_FORCE_ANDROID_BUILD: 'true'
        IPINDOU_RELEASE_STORE_PASSWORD: android
        IPINDOU_RELEASE_KEY_PASSWORD: android
        IPINDOU_RELEASE_KEY_ALIAS: ipindou-ci-release

    - name: Verify release APK signature
      run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify app/build/outputs/apk/release/*.apk

    - name: Upload release APK
      uses: actions/upload-artifact@v6
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk

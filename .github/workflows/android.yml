name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android platform
      run: sdkmanager 'platforms;android-35'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.14.4'

    - name: Run core JVM tests
      run: gradle :app:testCoreJava --warning-mode all

    - name: Build debug APK with Android toolchain
      run: gradle :app:assembleDebug --warning-mode all
      env:
        IPINDOU_FORCE_ANDROID_BUILD: 'true'

    - name: Upload debug APK
      uses: actions/upload-artifact@v6
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
